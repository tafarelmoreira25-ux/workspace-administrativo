<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Workspace Administrativo Platino</title>
    <style>
      /* ASSINATURA DO DESENVOLVEDOR */
      .dev-badge-container {
        position: fixed;
        right: 1rem;
        bottom: 1rem;
        z-index: 9999;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.35rem 0.45rem;
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 9999px;
        background: rgba(15, 23, 42, 0.88);
        box-shadow: 0 8px 20px rgba(15, 23, 42, 0.25);
        backdrop-filter: blur(12px);
        cursor: default;
        font-family: Inter, Arial, sans-serif;
        transition: all 0.3s ease;
      }

      .dev-badge-container:hover,
      .dev-badge-container:focus {
        transform: translateY(-2px);
        background: rgba(15, 23, 42, 0.96);
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.35);
        outline: none;
      }

      .dev-badge-icon {
        width: 24px;
        height: 24px;
        min-width: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 9999px;
        color: #0f172a;
        background: linear-gradient(135deg, #e2e8f0, #94a3b8);
        font-size: 0.7rem;
        font-weight: 800;
        letter-spacing: -0.04em;
      }

      .text-reveal {
        max-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        opacity: 0;
        white-space: nowrap;
        transition:
          max-width 0.35s ease,
          opacity 0.25s ease,
          padding 0.25s ease;
      }

      .dev-badge-container:hover .text-reveal,
      .dev-badge-container:focus .text-reveal {
        max-width: 180px;
        padding-right: 0.3rem;
        opacity: 1;
      }

      .text-line-1 {
        color: #94a3b8;
        font-size: 0.55rem;
        line-height: 1;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .text-line-2 {
        color: #f8fafc;
        font-size: 0.72rem;
        font-weight: 600;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- ASSINATURA DO DESENVOLVEDOR -->
    <div
      class="dev-badge-container"
      aria-label="Desenvolvido por Tafarel Moreira"
      tabindex="0"
    >
      <div class="dev-badge-icon">TM</div>

      <div class="text-reveal">
        <span class="text-line-1">Desenvolvido por</span>
        <span class="text-line-2">Tafarel Moreira</span>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
